name: Build Eastbank school assets once
on:
  push:
    branches: [level/eastbank-school]
    paths: [.eastbank-build.zip]
permissions:
  contents: write
jobs:
  build-school:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare inspection and preserve the saved assets
        id: assets
        run: |
          python3 -m zipfile -e .eastbank-build.zip .eastbank-work
          if test -f source/levels/eastbank-school.blend && test -f dist/assets/levels/eastbank-school.glb; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the editable Blender campus
        if: steps.assets.outputs.ready != 'true'
        run: |
          curl -fL https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/eastbank-blender.tar.xz
          tar -xJf /tmp/eastbank-blender.tar.xz -C /tmp
          EASTBANK_REPO="$GITHUB_WORKSPACE" /tmp/blender-4.5.3-linux-x64/blender -b --factory-startup -t 2 --python .eastbank-work/build_eastbank.py > .eastbank-work/build.log 2>&1
          tail -8 .eastbank-work/build.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pack and validate the GLB without reducing geometry
        if: steps.assets.outputs.ready != 'true'
        run: |
          npm install --prefix .eastbank-work/gltf-tools @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 @gltf-transform/functions@4.5.1 meshoptimizer@0.25.0 gltf-validator@2.0.0-dev.3.10
          mkdir -p dist/assets/levels
          node .eastbank-work/pack_glb.mjs .eastbank-work/eastbank-school-raw.glb dist/assets/levels/eastbank-school.glb
          node .eastbank-work/validate.mjs dist/assets/levels/eastbank-school.glb
          rm dist/assets/levels/eastbank-school.glb.stats.json
      - name: Save the source and asset on the school branch
        if: steps.assets.outputs.ready != 'true'
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git add source/levels/eastbank-school.blend dist/assets/levels/eastbank-school.glb
          git commit -m 'Add editable Eastbank school campus and game-ready environment asset'
          git push origin HEAD:level/eastbank-school
      - name: Inspect using the existing Three.js loader
        run: |
          npm install --prefix /tmp/eastbank-qa playwright@1.56.1
          /tmp/eastbank-qa/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p incoming-school
          cp .eastbank-work/qa* incoming-school/
          python3 -m http.server 8080 > /tmp/eastbank-server.log 2>&1 &
          NODE_PATH=/tmp/eastbank-qa/node_modules node incoming-school/qa_capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eastbank-inspection
          path: |
            school-qa/
            .eastbank-work/build.log
            .eastbank-work/stats.json
            .eastbank-work/validation.json
          retention-days: 7
      - name: Remove the temporary build package and workflow
        run: |
          git rm .eastbank-build.zip .github/workflows/build-school-once.yml
          git commit -m 'Finish school asset verification and remove temporary builder'
          git push origin HEAD:level/eastbank-school
